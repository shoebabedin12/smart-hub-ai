name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main] # আপনার গিটহাবের মেইন ব্রাঞ্চের নাম যদি master হয়, তবে এখানে master লিখবেন

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://shoebabedin12:$HF_TOKEN@huggingface.co/spaces/shoebabedin12/smart-hub-db main:main